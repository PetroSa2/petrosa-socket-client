name: CI Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  pipeline:
    name: CI Pipeline
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@6aebf4f0a2d3829dc0b507f6c2ef0a464dcda01c  # yamllint disable-line rule:line-length
    with:
      service-name: 'socket-client'
      image-name: 'yurisa2/petrosa-socket-client'
      python-version: '3.11'
      skip-docker-build: true
      # Explicit per-repo floor (petrosa_k8s#1052 epic step 5 / #142). Measured
      # coverage is ~85.55% — matching the canonical Golden Standard floor of
      # 40 already enforced locally via Makefile's COVERAGE_THRESHOLD (#136),
      # pinned explicitly here too so CI doesn't silently rely on the shared
      # workflow's default if that default ever changes.
      coverage-threshold: '40'
    secrets: inherit
