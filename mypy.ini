# Canonical mypy configuration for this repo (petrosa_k8s#1052 epic / #142).
# mypy reads mypy.ini before pyproject.toml's [tool.mypy] section when both
# are present, so this file always wins; the duplicate block that used to
# live in pyproject.toml has been removed there.
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = False
strict_equality = True
show_error_codes = True
exclude = (?x)(
    ^scripts/run_pipeline\.py$
    |^scripts/test_pipeline_simulation\.py$
    |^scripts/test_production_simulation\.py$
    |^scripts/test_integration\.py$
    |^scripts/test_otel_setup\.py$
    |^scripts/test_nats_messaging\.py$
    |^scripts/telemetry_test_script\.py$
    |^scripts/fix_.*\.py$
    |^scripts/add_.*\.py$
    |^scripts/auto_context\.py$
    |^tests/.*
  )

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-nats.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-orjson.*]
ignore_missing_imports = True

[mypy-pybreaker.*]
ignore_missing_imports = True

[mypy-petrosa_otel.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True
